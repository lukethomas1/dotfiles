# AeroSpace — the macOS mirror of the Niri config in dot_config/niri/cfg/keybinds.kdl.
#
# Caps Lock is the window-manager modifier on both hosts. macOS has no spare
# modifier bit, so Karabiner makes Caps Lock impersonate Alt+Cmd
# (dot_config/karabiner/karabiner.json). The translation is:
#
#   Niri Mod+X             ->  alt-cmd-X
#   Niri Mod+Shift+X       ->  alt-cmd-shift-X
#   Niri Mod+Ctrl+X        ->  alt-ctrl-cmd-X
#   Niri Mod+Ctrl+Shift+X  ->  alt-ctrl-cmd-shift-X
#
# You press the same physical keys on both hosts. Ctrl and Shift must stay OUT of
# the Caps chord or those last two families collapse into the first two — which is
# why this is not the usual "Hyper" (cmd-ctrl-alt-shift) recipe. See KEYBINDINGS.md.
#
# Nothing here may bind bare Alt: that belongs to the shell (readline word motion)
# and to herdr's Alt+Space prefix.
#
# AeroSpace requires one consistent modifier order. Its canonical order is
# alt-ctrl-cmd-shift; declaring a chord in any other order is a config error.

config-version = 2

# Under config-version 1, persistent workspaces were INFERRED from the keybindings
# below. Version 2 drops that inference and falls back to an empty array, so they
# must be declared. Doing so also matches Niri, where 1-9 are named workspaces that
# always exist rather than dynamic ones that vanish when empty.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
]

start-at-login = true

# Cmd+H is herdr's previous_tab. AeroSpace also un-hides anything that slips past.
automatically-unhide-macos-hidden-apps = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

[mode.main.binding]

    # ─── Applications ───  (Niri: Mod+Return / Mod+B / Mod+E)
    alt-cmd-enter = 'exec-and-forget open -na Ghostty'
    alt-cmd-b = 'exec-and-forget open -a Firefox'
    alt-cmd-e = 'exec-and-forget open -a Finder'

    # Niri's Mod+Space opens a launcher. Deliberately unbound here: alt-cmd-space
    # is a WindowServer-level Spotlight hotkey and would beat AeroSpace. On macOS
    # the launcher is Spotlight on Cmd+Space.
    #
    # Niri's Mod+Alt+L locks the screen. The Mod+Alt family cannot exist on macOS
    # (Alt is inside the Caps chord); use the native Ctrl+Cmd+Q.

    # ─── Window focus ───  (Niri: Mod+H/L columns, Mod+Up/Down within a column)
    alt-cmd-h = 'focus left'
    alt-cmd-l = 'focus right'
    alt-cmd-left = 'focus left'
    alt-cmd-right = 'focus right'
    alt-cmd-up = 'focus up'
    alt-cmd-down = 'focus down'

    # ─── Move window ───  (Niri: Mod+Shift+H/J/K/L and Mod+Shift+arrows)
    # Shift MOVES. This is the i3 convention and AeroSpace's own default, and
    # Niri was swapped to match — the one deliberate change to the Arch side.
    alt-cmd-shift-h = 'move left'
    alt-cmd-shift-l = 'move right'
    alt-cmd-shift-j = 'move down'
    alt-cmd-shift-k = 'move up'
    alt-cmd-shift-left = 'move left'
    alt-cmd-shift-right = 'move right'
    alt-cmd-shift-up = 'move up'
    alt-cmd-shift-down = 'move down'

    # ─── Monitor focus ───  (Niri: Mod+J/K, and Mod+Ctrl+H/J/K/L + arrows)
    alt-cmd-j = 'focus-monitor down'
    alt-cmd-k = 'focus-monitor up'
    alt-ctrl-cmd-h = 'focus-monitor left'
    alt-ctrl-cmd-l = 'focus-monitor right'
    alt-ctrl-cmd-j = 'focus-monitor down'
    alt-ctrl-cmd-k = 'focus-monitor up'
    alt-ctrl-cmd-left = 'focus-monitor left'
    alt-ctrl-cmd-right = 'focus-monitor right'
    alt-ctrl-cmd-up = 'focus-monitor up'
    alt-ctrl-cmd-down = 'focus-monitor down'

    # ─── Move window to monitor ───  (Niri: Mod+Ctrl+Shift+arrows)
    alt-ctrl-cmd-shift-left = 'move-node-to-monitor --focus-follows-window left'
    alt-ctrl-cmd-shift-right = 'move-node-to-monitor --focus-follows-window right'
    alt-ctrl-cmd-shift-up = 'move-node-to-monitor --focus-follows-window up'
    alt-ctrl-cmd-shift-down = 'move-node-to-monitor --focus-follows-window down'

    # ─── Workspaces ───  (Niri: Mod+1..9, Mod+Shift+1..9)
    alt-cmd-1 = 'workspace 1'
    alt-cmd-2 = 'workspace 2'
    alt-cmd-3 = 'workspace 3'
    alt-cmd-4 = 'workspace 4'
    alt-cmd-5 = 'workspace 5'
    alt-cmd-6 = 'workspace 6'
    alt-cmd-7 = 'workspace 7'
    alt-cmd-8 = 'workspace 8'
    alt-cmd-9 = 'workspace 9'

    alt-cmd-shift-1 = 'move-node-to-workspace 1'
    alt-cmd-shift-2 = 'move-node-to-workspace 2'
    alt-cmd-shift-3 = 'move-node-to-workspace 3'
    alt-cmd-shift-4 = 'move-node-to-workspace 4'
    alt-cmd-shift-5 = 'move-node-to-workspace 5'
    alt-cmd-shift-6 = 'move-node-to-workspace 6'
    alt-cmd-shift-7 = 'move-node-to-workspace 7'
    alt-cmd-shift-8 = 'move-node-to-workspace 8'
    alt-cmd-shift-9 = 'move-node-to-workspace 9'

    # Niri: Mod+Tab / Mod+Shift+Tab. Cmd is inside the chord, so alt-cmd-tab
    # brushes against the Dock's app switcher — verify after any macOS update.
    alt-cmd-tab = 'workspace-back-and-forth'
    alt-cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # ─── Sizing ───  (Niri: Mod+Minus/Equal, Mod+Shift+Minus/Equal)
    alt-cmd-minus = 'resize smart -50'
    alt-cmd-equal = 'resize smart +50'
    alt-cmd-shift-minus = 'resize height -50'
    alt-cmd-shift-equal = 'resize height +50'

    # ─── Modes ───  (Niri: Mod+Q close, Mod+F fullscreen, Mod+T float, Mod+W tabbed)
    alt-cmd-q = 'close'
    alt-cmd-f = 'fullscreen'
    alt-cmd-t = 'layout floating tiling'
    alt-cmd-w = 'layout accordion tiles'

    # Niri's Mod+O is a zoomed-out overview. AeroSpace has no equivalent; Mission
    # Control is the closest approximation.
    alt-cmd-o = 'exec-and-forget open -a "Mission Control"'

    # Niri has no equivalent of these; kept as AeroSpace extras.
    alt-cmd-slash = 'layout tiles horizontal vertical'
    alt-cmd-comma = 'layout accordion horizontal vertical'

    alt-cmd-shift-semicolon = 'mode service'

# Bindings in a non-main mode are only registered while that mode is active, so
# these do not claim Alt globally.
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
