onboarding = false

[keys]
# Ergonomic terminal-multiplexer prefix; press Alt+Space, then the command key.
prefix = "alt+space"

# Physical Cmd/Super keys remain Super, so these are pressed as Cmd+… .
#
# These are arrays, not bare strings, on purpose: a bare string REPLACES herdr's
# default binding instead of adding to it. Keeping the prefix chords alive gives
# a fallback for exactly the cases where the OS claims a Cmd key.
previous_tab = ["prefix+p", "super+h"]
next_tab = ["prefix+n", "super+l"]
close_pane = ["prefix+x", "super+w"]
new_tab = ["prefix+c", "super+t"]
new_workspace = ["prefix+shift+n", "super+n"]
split_vertical = ["prefix+v", "super+d"]
split_horizontal = ["prefix+minus", "super+minus"]

# No herdr defaults exist for these, so a single binding is complete.
previous_workspace = "super+k"
next_workspace = "super+j"

previous_agent = "ctrl+super+k"
next_agent = "ctrl+super+j"

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false
